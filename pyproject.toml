[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "procgen-playground"
version = "0.1.0.dev0"
description = "Play the original ProcGen environments on Windows without Python setup"
requires-python = ">=3.10,<3.11"
dependencies = ["procgen==0.10.7", "numpy==1.26.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src"]
strict = true
ignore_missing_imports = true
